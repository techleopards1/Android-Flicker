# ============================================================
# Gradle Version Catalog — single source of truth for all
# dependency and plugin versions in this project.
#
# UPDATE STRATEGY
# ---------------
# 1. Change the version value in [versions] only.
# 2. Run ./gradlew build to verify compatibility.
# 3. Run ./gradlew :app:lintDebug — lint flags outdated versions
#    automatically (GradleDependency / AndroidGradlePluginVersion).
# 4. Never hardcode a version string in any build.gradle.kts file.
# 5. Prefer bumping patch/minor versions first; test thoroughly
#    before major version upgrades (e.g. AGP major, Compose BOM year).
#
# ADDING A NEW DEPENDENCY
# -----------------------
# 1. Add the version ref under [versions] if it is not shared.
# 2. Declare the library alias under [libraries].
# 3. Add it to an existing [bundles] group or create a new one.
# 4. Reference it via libs.<alias> in the relevant build.gradle.kts.
# ============================================================

[versions]
# ── Build toolchain ──────────────────────────────────────────
agp         = "8.9.3"
kotlin      = "2.0.0"
ksp         = "2.0.0-1.0.21"

# ── Code quality ─────────────────────────────────────────────
detekt      = "1.23.7"
spotless    = "6.25.0"

# ── AndroidX core ────────────────────────────────────────────
coreKtx     = "1.18.0"
lifecycle   = "2.10.0"
activity    = "1.13.0"

# ── Compose ──────────────────────────────────────────────────
composeBom  = "2026.05.00"
navigation  = "2.9.0"

# ── Dependency injection ─────────────────────────────────────
hilt            = "2.54"
hiltNavigation  = "1.3.0"

# ── Networking ───────────────────────────────────────────────
retrofit    = "2.11.0"
okhttp      = "4.12.0"
gson        = "2.11.0"

# ── Async ────────────────────────────────────────────────────
coroutines  = "1.9.0"

# ── Testing ──────────────────────────────────────────────────
junit       = "4.13.2"
junitExt    = "1.3.0"
espresso    = "3.7.0"

# ─────────────────────────────────────────────────────────────

[libraries]
# Core
androidx-core-ktx                   = { group = "androidx.core",            name = "core-ktx",                      version.ref = "coreKtx"    }

# Lifecycle
androidx-lifecycle-runtime          = { group = "androidx.lifecycle",        name = "lifecycle-runtime-ktx",         version.ref = "lifecycle"  }
androidx-lifecycle-viewmodel-compose= { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-compose",   version.ref = "lifecycle"  }

# Activity
androidx-activity-compose           = { group = "androidx.activity",         name = "activity-compose",              version.ref = "activity"   }

# Compose BOM (manages individual Compose library versions)
androidx-compose-bom                = { group = "androidx.compose",          name = "compose-bom",                   version.ref = "composeBom" }
androidx-compose-ui                 = { group = "androidx.compose.ui",       name = "ui"                                                       }
androidx-compose-ui-graphics        = { group = "androidx.compose.ui",       name = "ui-graphics"                                              }
androidx-compose-ui-tooling         = { group = "androidx.compose.ui",       name = "ui-tooling"                                               }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui",       name = "ui-tooling-preview"                                       }
androidx-compose-ui-test-manifest   = { group = "androidx.compose.ui",       name = "ui-test-manifest"                                         }
androidx-compose-ui-test-junit4     = { group = "androidx.compose.ui",       name = "ui-test-junit4"                                           }
androidx-compose-material3          = { group = "androidx.compose.material3",name = "material3"                                                }

# Navigation
androidx-navigation-compose         = { group = "androidx.navigation",       name = "navigation-compose",            version.ref = "navigation" }

# Hilt
hilt-android                        = { group = "com.google.dagger",         name = "hilt-android",                  version.ref = "hilt"       }
hilt-compiler                       = { group = "com.google.dagger",         name = "hilt-android-compiler",         version.ref = "hilt"       }
hilt-navigation-compose             = { group = "androidx.hilt",             name = "hilt-navigation-compose",       version.ref = "hiltNavigation" }

# Retrofit + OkHttp
retrofit                            = { group = "com.squareup.retrofit2",    name = "retrofit",                      version.ref = "retrofit"   }
retrofit-converter-gson             = { group = "com.squareup.retrofit2",    name = "converter-gson",                version.ref = "retrofit"   }
okhttp                              = { group = "com.squareup.okhttp3",      name = "okhttp",                        version.ref = "okhttp"     }
okhttp-logging-interceptor          = { group = "com.squareup.okhttp3",      name = "logging-interceptor",           version.ref = "okhttp"     }

# Gson
gson                                = { group = "com.google.code.gson",      name = "gson",                          version.ref = "gson"       }

# Coroutines
kotlinx-coroutines-core             = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-core",       version.ref = "coroutines" }
kotlinx-coroutines-android          = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android",    version.ref = "coroutines" }

# Testing
junit                               = { group = "junit",                     name = "junit",                         version.ref = "junit"      }
androidx-test-junit                 = { group = "androidx.test.ext",         name = "junit",                         version.ref = "junitExt"   }
androidx-test-espresso              = { group = "androidx.test.espresso",    name = "espresso-core",                 version.ref = "espresso"   }

# ─────────────────────────────────────────────────────────────

[bundles]
# Use bundles to import a group of related libs with one alias.
# Reference with: implementation(libs.bundles.<name>)

compose-core = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
]

compose-debug = [
    "androidx-compose-ui-tooling",
    "androidx-compose-ui-test-manifest",
]

lifecycle = [
    "androidx-lifecycle-runtime",
    "androidx-lifecycle-viewmodel-compose",
]

retrofit = [
    "retrofit",
    "retrofit-converter-gson",
    "okhttp",
    "okhttp-logging-interceptor",
    "gson",
]

coroutines = [
    "kotlinx-coroutines-core",
    "kotlinx-coroutines-android",
]

testing-unit = [
    "junit",
]

testing-android = [
    "androidx-test-junit",
    "androidx-test-espresso",
]

# ─────────────────────────────────────────────────────────────

[plugins]
android-application = { id = "com.android.application",            version.ref = "agp"    }
kotlin-android      = { id = "org.jetbrains.kotlin.android",       version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",version.ref = "kotlin" }
hilt                = { id = "com.google.dagger.hilt.android",     version.ref = "hilt"   }
ksp                 = { id = "com.google.devtools.ksp",            version.ref = "ksp"    }
detekt              = { id = "io.gitlab.arturbosch.detekt",        version.ref = "detekt"   }
spotless            = { id = "com.diffplug.spotless",              version.ref = "spotless" }
